server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão (o text/html já é comprimido por padrão). O nginx:stable-alpine não inclui brotli.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        image/x-icon
        model/gltf-binary;

    # Arquivos com hash no nome (Vite): o conteúdo nunca muda sob a mesma URL, cache de 1 ano e imutável.
    # Hash antigo que sumiu devolve 404 (não o HTML do app).
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        try_files $uri =404;
    }

    # Modelo 3D (.glb não consta no mime.types padrão).
    location ~* \.glb$ {
        types { model/gltf-binary glb; }
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        try_files $uri =404;
    }

    # Estáticos sem hash no nome: cache moderado para uma troca de arquivo aparecer em até 1 dia (modelos, raiz) ou 7 dias (mídia).
    location ~* ^/(videos|images|icons)/ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        try_files $uri =404;
    }

    location ~* ^/(models/.+|[^/]+\.(ico|png|webmanifest))$ {
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        try_files $uri =404;
    }

    # robots.txt e sitemap: sempre atuais e com o tipo certo para os buscadores.
    location = /robots.txt {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location = /sitemap.xml {
        default_type application/xml;
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # HTML (páginas pré-renderizadas): sempre revalida com ETag, para um deploy novo valer na hora e
    # o HTML nunca apontar para assets com hash já removidos.
    # $uri/index.html serve cada rota de SEO sem exigir barra final.
    # URL sem página estática responde 404 de verdade (nada de "soft 404" com status 200): o corpo é /404.html, com noindex.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        try_files $uri $uri/index.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, follow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    }
}
